[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dup-radar-news-mcp"
version = "0.1.0"
description = "Read-only MCP for DUP Market Radar digests (1h movers, funding, listings)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Uladzimir Dabranski" }]
keywords = ["mcp", "dup-labs", "market-radar", "digest", "fail-closed"]
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
dup-radar-news-mcp = "radar_news_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Gruver87/dup-radar-news-mcp"
Repository = "https://github.com/Gruver87/dup-radar-news-mcp"
Related = "https://github.com/Gruver87/dup-market-radar"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
